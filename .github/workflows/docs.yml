name: Docstring Coverage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  interrogate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run docstring sync
        run: uv run python scripts/update_docs.py

      - name: Check for doc alterations
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Documentation is out of sync with docstrings. Please run 'python scripts/update_docs.py' and commit the changes."
            git diff
            exit 1
          fi

      - name: Run interrogate
        run: uv run interrogate src/focusnfe
